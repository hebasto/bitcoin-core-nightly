name: MRE (scratch)
on:
  push:
    branches: ['261020-gcc-mre']

env:
  # Bitcoin Core's compile flags (dev-mode preset, hardening on), without -I/-isystem.
  FLAGS: -O2 -g -std=c++20 -fPIC -fno-extended-identifiers -fstack-reuse=none -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wstack-protector -fstack-protector-all -fcf-protection=full -fstack-clash-protection -Wall -Wextra -Wformat -Wformat-security -Wvla -Wredundant-decls -Wunused-const-variable -Wdate-time -Wduplicated-branches -Wduplicated-cond -Wlogical-op -Woverloaded-virtual -Wsuggest-override -Wimplicit-fallthrough -Wunreachable-code -Wbidi-chars=any -Wundef -Wno-unused-parameter

jobs:
  reduce:
    name: 'Continue reducing txmempool.ii with cvise'
    runs-on: ubuntu-26.04
    container: ghcr.io/hebasto/gcc-snapshot:17
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git ca-certificates curl xz-utils cvise
          cat /opt/gcc-snapshot/SNAPSHOT

      - name: Checkout scratch branch
        uses: actions/checkout@v7

      - name: Hand-written candidate against Boost 1.92.0
        run: |
          curl -sSL -o boost.tar.xz https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-b2-nodocs.tar.xz
          tar -xJf boost.tar.xz
          for f in mre/*.cpp; do
            echo "::group::$f"
            g++-snapshot $FLAGS -isystem boost-1.92.0 -c "$f" -o /dev/null 2>&1 | grep -E 'warning:|error:' || echo "(clean)"
            echo "::endgroup::"
          done

      - name: Download the partially reduced file from the previous run
        uses: actions/download-artifact@v8
        with:
          name: reduced-txmempool
          run-id: 39402706636
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work

      - name: Check interestingness
        working-directory: work
        run: |
          ls -l
          cat > test.sh <<'EOF2'
          #!/bin/sh
          g++-snapshot $FLAGS -c txmempool.ii -o /dev/null > out.txt 2>&1
          ! grep -q 'error:' out.txt && grep -q 'specified bound 18446744073709551608 exceeds maximum object size' out.txt
          EOF2
          chmod +x test.sh
          wc -l txmempool.ii
          ./test.sh && echo "interesting" || { echo "NOT interesting"; head -40 out.txt; exit 1; }

      - name: Reduce with cvise (time-boxed)
        working-directory: work
        run: |
          timeout 280m cvise --n $(nproc) --timeout 300 test.sh txmempool.ii || echo "cvise stopped (timeout or error)"
          wc -lc txmempool.ii
          echo "::group::diagnostics on reduced file"
          g++-snapshot $FLAGS -c txmempool.ii -o /dev/null 2>&1 | grep -E 'warning:|error:' | head -40
          echo "::endgroup::"

      - name: Commit the reduced file to the scratch branch
        if: always()
        run: |
          mkdir -p mre && cp work/txmempool.ii mre/reduced.ii && cp work/test.sh mre/test.sh
          git config user.name "Hennadii Stepanov"
          git config user.email "32963518+hebasto@users.noreply.github.com"
          git add mre/reduced.ii mre/test.sh
          git commit -m "Scratch: cvise result ($(wc -l < mre/reduced.ii) lines) [skip ci]" || echo "nothing to commit"
          git push

      - name: Upload reduced file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reduced-txmempool
          path: |
            work/txmempool.ii
            work/test.sh
          retention-days: 7
