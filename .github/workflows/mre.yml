name: MRE (scratch)
on:
  push:
    branches: ['261020-gcc-mre']

jobs:
  reduce:
    name: 'Reduce txmempool.cpp warning with cvise'
    runs-on: ubuntu-26.04
    container: ghcr.io/hebasto/gcc-snapshot:17
    timeout-minutes: 350
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            git ca-certificates cmake ninja-build make curl patch pkg-config python3 bison file cvise
          cat /opt/gcc-snapshot/SNAPSHOT
          cvise --version

      - name: Checkout Bitcoin Core
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin
          path: bitcoin

      - name: Build depends
        run: |
          gmake -C bitcoin/depends -j $(nproc) CC=gcc-snapshot CXX=g++-snapshot build_CC=gcc-snapshot build_CXX=g++-snapshot NO_QT=1 NO_IPC=1 LOG=1

      - name: Configure and compile txmempool.cpp
        working-directory: bitcoin
        run: |
          cmake --preset dev-mode --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake -DBUILD_GUI=OFF -DENABLE_IPC=OFF > /dev/null
          cmd=$(ninja -C build_dev_mode -t commands src/CMakeFiles/bitcoin_node.dir/txmempool.cpp.o | tail -1)
          echo "COMMAND: $cmd"
          cd build_dev_mode
          echo "::group::original diagnostics"
          sh -c "$cmd" 2>&1 | grep -E 'warning:|error:' || echo "(no warning on original!)"
          echo "::endgroup::"
          # Flags without -c/-o/dependency options; the object file name becomes the .ii input.
          flags=$(python3 - "$cmd" <<'PY'
          import shlex, sys
          t = shlex.split(sys.argv[1]); out = []; skip = False
          for i, a in enumerate(t[1:]):
              if skip: skip = False; continue
              if a in ('-o', '-MF', '-MT', '-MQ'): skip = True; continue
              if a in ('-c', '-MD', '-MMD') or a.endswith('txmempool.cpp'): continue
              out.append(a)
          print(shlex.join(out))
          PY
          )
          echo "FLAGS=$flags" | tee -a "$GITHUB_ENV"
          sh -c "$cmd -E -o ../txmempool.ii"
          ls -l ../txmempool.ii

      - name: Check the warning reproduces on the preprocessed file
        working-directory: bitcoin
        run: |
          cat > test.sh <<'EOF2'
          #!/bin/sh
          g++-snapshot $FLAGS -c txmempool.ii -o /dev/null > out.txt 2>&1
          ! grep -q 'error:' out.txt && grep -q 'specified bound 18446744073709551608 exceeds maximum object size' out.txt
          EOF2
          chmod +x test.sh
          ./test.sh && echo "interesting" || { echo "NOT interesting"; cat out.txt | head -40; exit 1; }

      - name: Reduce with cvise (time-boxed)
        working-directory: bitcoin
        run: |
          timeout 270m cvise --n $(nproc) --timeout 300 test.sh txmempool.ii || echo "cvise stopped (timeout or error)"
          echo "::group::reduced file ($(wc -c < txmempool.ii) bytes)"
          cat txmempool.ii
          echo "::endgroup::"
          echo "::group::diagnostics on reduced file"
          g++-snapshot $FLAGS -c txmempool.ii -o /dev/null 2>&1 | head -60
          echo "::endgroup::"

      - name: Upload reduced file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reduced-txmempool
          path: |
            bitcoin/txmempool.ii
            bitcoin/test.sh
          retention-days: 7
