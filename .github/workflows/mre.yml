name: MRE (scratch)
on:
  push:
    branches: ['261020-gcc-mre']

env:
  EXTRA_FLAGS: ''

jobs:
  mre:
    name: 'MRE with GCC snapshot, ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/hebasto/gcc-snapshot:17
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git ca-certificates libboost-dev
          dpkg -s libboost-dev | grep ^Version
          cat /opt/gcc-snapshot/SNAPSHOT

      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Boost 1.92.0 (same as depends)
        run: |
          apt-get install --no-install-recommends -y curl xz-utils
          curl -sSL -o boost.tar.xz https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-b2-nodocs.tar.xz
          tar -xJf boost.tar.xz
          ls -d boost-1.92.0

      - name: Compile candidates
        run: |
          HARDEN="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-protector-all -fcf-protection=full -fstack-clash-protection -fPIE"
          for inc in "-I boost-1.92.0" ""; do
            for f in mre/*.cpp; do
              for flags in "-O2" "-O2 -g" "-O2 -g $HARDEN" "-O3 -g $HARDEN" "-O2 -D_FORTIFY_SOURCE=3"; do
                echo "::group::[boost: ${inc:-debian}] $f $flags"
                g++-snapshot -std=c++20 $inc $flags -Wall -Wextra ${{ env.EXTRA_FLAGS }} -c "$f" -o /dev/null 2>&1 | grep -E 'warning:|error:' || echo "(clean)"
                echo "::endgroup::"
              done
            done
          done
