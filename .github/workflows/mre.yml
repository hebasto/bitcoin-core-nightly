name: MRE (scratch)
on:
  push:
    branches: ['261020-gcc-mre']

env:
  FLAGS: -O2 -g -std=c++20 -fPIC -fno-extended-identifiers -fstack-reuse=none -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wstack-protector -fstack-protector-all -fcf-protection=full -fstack-clash-protection -Wall -Wextra -Wformat -Wformat-security -Wvla -Wredundant-decls -Wunused-const-variable -Wdate-time -Wduplicated-branches -Wduplicated-cond -Wlogical-op -Woverloaded-virtual -Wsuggest-override -Wimplicit-fallthrough -Wunreachable-code -Wbidi-chars=any -Wundef -Wno-unused-parameter

jobs:
  candidates:
    name: 'MRE candidates, ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/hebasto/gcc-snapshot:17
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git ca-certificates curl xz-utils
          cat /opt/gcc-snapshot/SNAPSHOT
      - uses: actions/checkout@v7
      - name: Fetch Boost 1.92.0
        run: |
          curl -sSL -o boost.tar.xz https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-b2-nodocs.tar.xz
          tar -xJf boost.tar.xz
      - name: Compile candidates
        run: |
          for f in mre/*.cpp; do
            for flags in "-O2 -Wall" "-O2 -Wall -fno-tree-loop-distribute-patterns" "-O2 -Wall -fno-inline-small-functions" "-O2 -Wall -fno-inline-functions-called-once" "-O1 -Wall" "-O3 -Wall"; do
              echo "::group::$f [$flags]"
              g++-snapshot -std=c++20 $flags -isystem boost-1.92.0 -c "$f" -o /dev/null 2>&1 | grep -E 'warning:|error:' || echo "(clean)"
              echo "::endgroup::"
            done
          done
