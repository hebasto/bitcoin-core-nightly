name: MRE (scratch)
on:
  push:
    branches: ['261020-gcc-mre']

env:
  STRICT: -Werror=return-type -Werror=uninitialized -Werror=maybe-uninitialized -Werror=implicit-fallthrough -Werror=sequence-point -Werror=array-bounds

jobs:
  reduce:
    name: 'Reduce txmempool.cpp at source level with cvise'
    runs-on: ubuntu-26.04
    container: ghcr.io/hebasto/gcc-snapshot:17
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            git ca-certificates cmake ninja-build make curl patch pkg-config python3 bison file cvise
          cat /opt/gcc-snapshot/SNAPSHOT

      - name: Checkout scratch branch
        uses: actions/checkout@v7

      - name: Checkout Bitcoin Core
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin
          path: bitcoin

      - name: Build depends
        run: |
          gmake -C bitcoin/depends -j $(nproc) CC=gcc-snapshot CXX=g++-snapshot build_CC=gcc-snapshot build_CXX=g++-snapshot NO_QT=1 NO_IPC=1 LOG=1

      - name: Configure and derive the compile flags of txmempool.cpp
        working-directory: bitcoin
        run: |
          cmake --preset dev-mode -G Ninja --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake -DBUILD_GUI=OFF -DENABLE_IPC=OFF > /dev/null
          cmd=$(ninja -C build_dev_mode -t commands src/CMakeFiles/bitcoin_node.dir/txmempool.cpp.o | tail -1)
          flags=$(python3 - "$cmd" <<'PY'
          import shlex, sys
          t = shlex.split(sys.argv[1]); out = []; skip = False
          for a in t[1:]:
              if skip: skip = False; continue
              if a in ('-o', '-MF', '-MT', '-MQ'): skip = True; continue
              if a in ('-c', '-MD', '-MMD') or a.endswith('txmempool.cpp'): continue
              out.append(a)
          print(shlex.join(out))
          PY
          )
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          echo "$flags"

      - name: Check interestingness on the original source
        run: |
          mkdir -p work && cp bitcoin/src/txmempool.cpp work/txmempool.cpp
          cat > work/test.sh <<'EOF2'
          #!/bin/sh
          g++-snapshot $FLAGS $STRICT -c txmempool.cpp -o /dev/null > out.txt 2>&1
          ! grep -q 'error:' out.txt && grep -q 'specified bound 18446744073709551608 exceeds maximum object size' out.txt
          EOF2
          chmod +x work/test.sh
          cd work && wc -l txmempool.cpp && ./test.sh && echo "interesting" || { echo "NOT interesting"; grep -E 'error:|warning:' out.txt | head; exit 1; }

      - name: Reduce with cvise
        working-directory: work
        run: |
          timeout 240m cvise --n $(nproc) --timeout 300 test.sh txmempool.cpp || echo "cvise stopped (timeout or error)"
          wc -lc txmempool.cpp
          echo "::group::reduced source"
          cat txmempool.cpp
          echo "::endgroup::"
          echo "::group::diagnostics on reduced source"
          g++-snapshot $FLAGS -c txmempool.cpp -o /dev/null 2>&1 | head -60
          echo "::endgroup::"

      - name: Commit the reduced source to the scratch branch
        if: always()
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p mre && cp work/txmempool.cpp mre/reduced_txmempool.cpp && cp work/test.sh mre/test.sh
          git config user.name "Hennadii Stepanov"
          git config user.email "32963518+hebasto@users.noreply.github.com"
          git add mre/
          git commit -m "Scratch: source-level cvise result ($(wc -l < mre/reduced_txmempool.cpp) lines) [skip ci]" || echo "nothing to commit"
          git push
