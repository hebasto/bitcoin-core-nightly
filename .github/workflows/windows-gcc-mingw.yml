name: Windows, GCC, MinGW
# Cross-compiles the depends packages (without Qt) and configures the build
# system with every combination of the supported GCC and mingw-w64 releases.
# Each toolchain is defined by its own nix script in windows-gcc-mingw/.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-gcc-mingw.yml'
      - 'windows-gcc-mingw/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_HOST: x86_64-w64-mingw32

jobs:
  windows-cross:
    name: 'Windows, GCC ${{ matrix.gcc }}, mingw-w64 ${{ matrix.mingw }}, depends, configure only'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 13, 14, 15, 16]
        mingw: [12, 13, 14]
    defaults:
      run:
        shell: nix-shell nightly/toolchain.nix --run "bash -eo pipefail {0}"

    steps:
      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Checkout nix scripts
        uses: actions/checkout@v7
        with:
          path: nightly
          sparse-checkout: windows-gcc-mingw

      - name: Select toolchain
        # The `shell` keys below cannot use expressions, so point a fixed path at the chosen script.
        shell: bash
        run: ln -s windows-gcc-mingw/gcc${{ matrix.gcc }}-mingw${{ matrix.mingw }}.nix nightly/toolchain.nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            # Evaluate the same nixpkgs revision in every step of the job.
            tarball-ttl = 86400

      - name: Build toolchain
        # Entering the shell builds (or fetches) the toolchain.
        run: true

      - name: Toolchain version
        run: |
          ${{ env.CI_HOST }}-gcc -v 2>&1 | tee gcc_version.txt
          echo | ${{ env.CI_HOST }}-gcc -dM -E -include _mingw.h - | grep -E '__MINGW64_VERSION_(MAJOR|MINOR|BUGFIX) ' | tee -a gcc_version.txt

      - name: Build depends
        run: |
          gmake -C depends -j $(nproc) HOST=${{ env.CI_HOST }} NO_QT=1 LOG=1

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "Windows, GCC ${{ matrix.gcc }}, mingw-w64 ${{ matrix.mingw }}, depends, configure only")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Unix Makefiles")
          EOF

      - name: CDash -- Start & Update
        shell: nix-shell nightly/toolchain.nix --run "ctest --script {0}"
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          set(CTEST_UPDATE_TYPE git)
          # This command may be redundant once the following MR is merged:
          # https://gitlab.kitware.com/cmake/cmake/-/merge_requests/12038
          set(CTEST_UPDATE_COMMAND "${CMAKE_COMMAND} -E true")
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: nix-shell nightly/toolchain.nix --run "ctest --extra-verbose --script {0}"
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          set(configure_opts
            "--toolchain depends/${{ env.CI_HOST }}/toolchain.cmake"
            "-DREDUCE_EXPORTS=ON"
            "-DBUILD_BENCH=ON"
            "-DBUILD_FUZZ_BINARY=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Submit
        if: always()
        shell: nix-shell nightly/toolchain.nix --run "ctest --script {0}"
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES "$ENV{GITHUB_WORKSPACE}/gcc_version.txt")
          ctest_submit()
