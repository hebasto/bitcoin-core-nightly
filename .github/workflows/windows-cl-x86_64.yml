name: Windows, cl.exe, x86_64
on:
  pull_request:
    paths:
      - '.github/workflows/windows-cl-x86_64.yml'
      - 'patches/windows-fopen-noinherit.patch'
      - 'patches/windows-msvc-werror-flag.patch'
      - 'patches/windows-msvc-not-null-static-assert.patch'
      - 'patches/windows-msvc-not-null-return.patch'
  workflow_dispatch:
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: 'Windows x86_64, cl.exe, no GUI, no IPC'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"

    env:
      VCPKG_PACKAGES: boost-multi-index boost-test sqlite3[core] zeromq

    steps:
      # vcpkg stores every package it builds in its binary cache and reuses an
      # archive only when the package ABI (triplet, compiler, port, features)
      # matches, so the cache key does not have to track those. It changes with
      # the runner image and with the package list, so a new image starts a
      # cache of its own instead of growing the old one with every rebuild.
      - name: Generate vcpkg cache key
        id: vcpkg-cache-key
        run: |
          Set-Content -Path vcpkg-packages.txt -Value $env:VCPKG_PACKAGES
          "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: cl-x86_64-vcpkg-${{ steps.vcpkg-cache-key.outputs.image-version }}-${{ hashFiles('vcpkg-packages.txt') }}
          restore-keys: cl-x86_64-vcpkg-${{ steps.vcpkg-cache-key.outputs.image-version }}-

      - name: Install dependencies
        run: |
          Add-Content -Path "$env:VCPKG_INSTALLATION_ROOT\triplets\x64-windows.cmake" -Value "set(VCPKG_BUILD_TYPE release)"
          vcpkg install ${{ env.VCPKG_PACKAGES }}

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: nightly

      # Keep child processes from inheriting open files; see the patch header.
      - name: Patch Bitcoin Core
        run: git apply --verbose nightly/patches/windows-fopen-noinherit.patch

      # Work around MSVC incompatibilities; see the patch headers.
      - name: Patch Bitcoin Core for cl.exe
        run: |
          git apply --verbose nightly/patches/windows-msvc-werror-flag.patch
          git apply --verbose nightly/patches/windows-msvc-not-null-static-assert.patch
          git apply --verbose nightly/patches/windows-msvc-not-null-return.patch

      - name: Install CMake nightly build
        run: |
          $base = "https://cmake.org/files/dev"
          # The directory keeps about a year of builds and has no "latest"
          # alias. In `cmake-<major>.<minor>.<YYYYMMDD>-g<hash>-...` the third
          # dot-separated field starts with the build date.
          $listing = (curl.exe --fail --silent --show-error --location --retry 5 --retry-delay 30 --retry-all-errors "$base/") -join "`n"
          $zip = [regex]::Matches($listing, 'href="(cmake-[^"]*-windows-x86_64\.zip)"') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object { $_.Split('.')[2] } | Select-Object -Last 1
          if (-not $zip) { throw "No CMake nightly build found at $base/" }
          curl.exe --fail --silent --show-error --location --retry 5 --retry-delay 30 --retry-all-errors --output "$env:RUNNER_TEMP\$zip" "$base/$zip"
          tar -xf "$env:RUNNER_TEMP\$zip" -C "$env:RUNNER_TEMP"
          # Takes precedence over the CMake that the runner image provides.
          "$env:RUNNER_TEMP\$($zip -replace '\.zip$')\bin" >> $env:GITHUB_PATH

      - name: CMake version
        run: |
          (Get-Command cmake, ctest).Source
          cmake --version | Tee-Object -FilePath cmake_version.txt

      - name: Generate CTest configuration
        run: |
          $config = @'
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "Windows x86_64, cl.exe, no GUI, no IPC")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Visual Studio 18 2026")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          '@
          Set-Content -Path "ctest_config.cmake" -Value $config -Encoding utf8

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          # CTest infers the VCS type from the update command's name. With
          # CTEST_UPDATE_VERSION_OVERRIDE set no update runs, but CTest still
          # invokes the command to list local modifications and reports any as
          # an update error. The command deliberately does not exist, so that
          # check is skipped on every runner, whether or not git is installed
          # and whether or not the tree has been patched.
          set(CTEST_UPDATE_COMMAND not-run/git)
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --build-config Release --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          set(ENV{CXXFLAGS} "/utf-8 /Zc:__cplusplus /wd4018 /wd4065 /wd4146 /wd4244 /wd4267 /wd4715 /wd4722 /wd4805")
          set(configure_opts
            "-DWITH_ZMQ=ON"
            "--toolchain $ENV{VCPKG_INSTALLATION_ROOT}\\scripts\\buildsystems\\vcpkg.cmake"
            "-DVCPKG_MANIFEST_MODE=OFF"
            "-DVCPKG_TARGET_TRIPLET=x64-windows"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --build-config Release --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Fetch test data
        run: |
          $dir = "$env:GITHUB_WORKSPACE\qa-assets\unit_test_data"
          "DIR_UNIT_TEST_DATA=$dir" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 30 --retry-all-errors --output "$dir\script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --build-config Release --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES "$ENV{GITHUB_WORKSPACE}/cmake_version.txt")
          ctest_submit()
