name: OmniOS
on:
  pull_request:
    paths:
      - '.github/workflows/omnios.yml'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository name with owner'
        required: true
        default: bitcoin/bitcoin
        type: string
      ref:
        description: 'Repository reference: refs/heads/<branch>, refs/tags/<tag>, refs/pull/<PR>/head or <commit>'
        required: true
        default: refs/heads/master
        type: string
      skip_functional_tests:
        description: 'Skip functional tests'
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  omnios:
    name: 'OmniOS ${{ matrix.name }}, no GUI'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: omnios {0}
    strategy:
      fail-fast: false
      matrix:
        # Bitcoin Core does not build on r151054 (current LTS). Its
        # sys/select.h uses memset in FD_ZERO() without declaring it.
        # Fixed in illumos-gate commit 6ffd7dd3, which is in r151056
        # and later.
        # Test the "old stable" and "current stable" releases.
        # See https://omnios.org/releasenotes.html.
        include:
          - release: 'r151056'
            name: 'r151056 - old stable'
            packages: 'developer/gcc14'
          - release: 'r151058'
            name: 'r151058 - current stable'
            packages: 'developer/gcc15'

    steps:
      - name: Annotate with workflow inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUTS_REPOSITORY: ${{ inputs.repository }}
          INPUTS_REF: ${{ inputs.ref }}
        shell: bash
        run: echo "::notice title=inputs::$INPUTS_REPOSITORY $INPUTS_REF"

      - name: Start OmniOS ${{ matrix.release }} VM
        uses: vmactions/omnios-vm@v1
        with:
          release: ${{ matrix.release }}
          mem: 12288
          prepare: |
            set -e
            pkg list -H -o name,publisher,version > packages_before
            pkg install ${{ matrix.packages }} \
              ooce/developer/cmake \
              ooce/developer/ninja \
              ooce/file/lsof \
              database/sqlite-3 \
              developer/pkg-config \
              runtime/python-313
            pkg list -H -o name,publisher,version > packages_after
            diff -w packages_before packages_after | grep '^>' || true
          sync: no
          disable-cache: true

      - name: GCC version
        run: gcc -v 2>&1 | tee gcc_version.txt

      - name: Check libstdc++ locale bug
        # See https://github.com/omniosorg/omnios-build/issues/4253.
        continue-on-error: true
        run: |
          set -e
          g++ -v 2>&1 | grep -o -- '--enable-clocale=[a-z]*' || echo 'clocale model: default'
          cat > locale_test.cpp << 'EOF'
          #include <iostream>
          #include <locale>
          #include <stdexcept>
          int main()
          {
              try {
                  std::locale("");
              } catch (const std::runtime_error& e) {
                  std::cout << e.what() << '\n';
              }
          }
          EOF
          g++ -std=c++20 locale_test.cpp -o locale_test
          # LC_ALL=C from the job env would mask the bug.
          unset LC_ALL
          set +e
          LANG=C.UTF-8 LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards ./locale_test
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=libstdc++ locale bug::std::locale(\"\") crashed (exit $status)"
            exit 1
          fi
          echo "std::locale(\"\") OK"

      - name: Build Boost
        env:
          BOOST_VERSION: '1.92.0'
        run: |
          set -e
          curl --location --fail --output boost.tar.xz https://github.com/boostorg/boost/releases/download/boost-${{ env.BOOST_VERSION }}/boost-${{ env.BOOST_VERSION }}-cmake.tar.xz
          tar xf boost.tar.xz
          cmake -S boost-${{ env.BOOST_VERSION }} -B build-boost \
            -DBOOST_INCLUDE_LIBRARIES="multi_index;test" \
            -DBOOST_TEST_HEADERS_ONLY=ON \
            -DBOOST_ENABLE_MPI=OFF \
            -DBOOST_ENABLE_PYTHON=OFF \
            -DBOOST_INSTALL_LAYOUT=system \
            -DBUILD_TESTING=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ICU=ON
          cmake --install build-boost

      - name: Build Cap'n Proto
        env:
          CAPNPROTO_VERSION: '1.5.0'
        run: |
          set -e
          curl --location --fail --remote-name https://capnproto.org/capnproto-c++-${{ env.CAPNPROTO_VERSION }}.tar.gz
          tar xf capnproto-c++-${{ env.CAPNPROTO_VERSION }}.tar.gz
          cd capnproto-c++-${{ env.CAPNPROTO_VERSION }}
          ./configure --without-fibers
          make -j $(getconf NPROCESSORS_ONLN) install

      # The OmniOS IPS repositories do not ship a ZeroMQ package.
      - name: Build ZeroMQ
        env:
          ZEROMQ_VERSION: '4.3.5'
        run: |
          set -e
          curl --location --fail --remote-name https://github.com/zeromq/libzmq/releases/download/v${{ env.ZEROMQ_VERSION }}/zeromq-${{ env.ZEROMQ_VERSION }}.tar.gz
          tar xf zeromq-${{ env.ZEROMQ_VERSION }}.tar.gz
          cmake -S zeromq-${{ env.ZEROMQ_VERSION }} -B build-zeromq -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.16 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_DOCS=OFF \
            -DWITH_LIBSODIUM=OFF \
            -DENABLE_CURVE=OFF \
            -DENABLE_DRAFTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_STATIC=OFF \
            -DWITH_PERF_TOOL=OFF \
            `# libzmq's CMake build does not link the Solaris networking libraries.` \
            -DCMAKE_SHARED_LINKER_FLAGS="-lsocket -lnsl"
          cmake --build build-zeromq -j $(getconf NPROCESSORS_ONLN)
          cmake --install build-zeromq
          # The 64-bit runtime linker does not search /usr/local/lib by
          # default, and pyzmq loads libzmq.so from there.
          crle -64 -u -l /usr/local/lib

      - name: Fetch source tarball
        run: |
          set -e
          pkg install archiver/gnu-tar
          curl --location --fail --output source.tar.gz https://github.com/${{ inputs.repository || 'bitcoin/bitcoin' }}/archive/${{ inputs.ref || 'refs/heads/master' }}.tar.gz
          mkdir bitcoin
          gtar -xf source.tar.gz -C bitcoin --strip-components=1
          rm -rf source.tar.gz
          # Test data.
          DIR_UNIT_TEST_DATA="$(pwd)/qa-assets/unit_test_data"
          mkdir -p "$DIR_UNIT_TEST_DATA"
          curl --location --fail --output "${DIR_UNIT_TEST_DATA}/script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "OmniOS ${{ matrix.name }}, no GUI")
          set(CTEST_SOURCE_DIRECTORY "${CTEST_SCRIPT_DIRECTORY}/bitcoin")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SCRIPT_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Ninja")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          EOF

      - name: CDash -- Start & Update
        run: |
          COMMIT="$(awk -F '"' '/^#define GIT_COMMIT_ID/ {print $2}' bitcoin/src/clientversion.cpp)"
          echo "set(CTEST_UPDATE_VERSION_OVERRIDE $COMMIT)" >> ctest_update_version_override.cmake
          cat << 'EOF' > ctest_start_update.cmake
          include(ctest_config.cmake)
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          # CTest infers the VCS type from the update command's name. With
          # CTEST_UPDATE_VERSION_OVERRIDE set, the command itself is never run.
          set(CTEST_UPDATE_COMMAND git)
          include(ctest_update_version_override.cmake)
          ctest_update()
          EOF
          ctest --script ctest_start_update.cmake

      - name: CDash -- Configure
        run: |
          cat << 'EOF' > ctest_configure.cmake
          include(ctest_config.cmake)
          # Workaround for a bug in the FindThreads module.
          # See https://gitlab.kitware.com/cmake/cmake/-/issues/26063.
          set(ENV{CXXFLAGS} "-pthread")
          set(configure_opts
            "--preset dev-mode"
            "-Wno-error=dev"
            "-DBUILD_GUI=OFF"
            "-DWITH_USDT=OFF"
            "-DCMAKE_PREFIX_PATH=/usr/local"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
            # GCC does not support -pie on OmniOS.
            # See https://www.illumos.org/issues/15730.
            # Therefore, CMake's check_pie_supported fails and
            # enforcing -fPIC is necessary for BUILD_SHARED_LIBS=ON.
            "-DAPPEND_CFLAGS=-fPIC"
            "-DAPPEND_CXXFLAGS=-fPIC"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")
          EOF
          ctest --extra-verbose --script ctest_configure.cmake

      - name: CDash -- Build
        run: |
          cat << 'EOF' > ctest_build.cmake
          include(ctest_config.cmake)
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})
          EOF
          ctest --extra-verbose --script ctest_build.cmake

      - name: Check 'bitcoind' executable
        run: |
          set -e
          ls -l build/bin/bitcoind
          file build/bin/bitcoind
          ldd build/bin/bitcoind
          build/bin/bitcoind -version

      - name: CDash -- Test
        run: |
          cat << 'EOF' > ctest_test.cmake
          include(ctest_config.cmake)
          set(ENV{DIR_UNIT_TEST_DATA} ${CTEST_SCRIPT_DIRECTORY}/qa-assets/unit_test_data)
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()
          EOF
          ctest --script ctest_test.cmake

      - name: CDash -- Submit
        if: always()
        run: |
          cat << 'EOF' > ctest_submit.cmake
          include(ctest_config.cmake)
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES gcc_version.txt)
          ctest_submit()
          EOF
          ctest --script ctest_submit.cmake

      - name: Install Python packages for functional tests
        if: ${{ ! inputs.skip_functional_tests }}
        run: |
          set -e
          export PIP_ROOT_USER_ACTION=ignore
          python3.13 -m ensurepip
          python3.13 -m pip install setuptools wheel
          python3.13 -m pip install pyzmq
          python3.13 -c "import zmq; print(f'pyzmq {zmq.__version__} / libzmq {zmq.zmq_version()}')"

      - name: Check host disk space
        if: ${{ ! inputs.skip_functional_tests }}
        shell: bash
        run: df -h

      - name: Check VM disk space
        if: ${{ ! inputs.skip_functional_tests }}
        run: df -h "$PWD"

      - name: Run functional tests
        if: ${{ ! inputs.skip_functional_tests }}
        run: |
          # Unbuffered stdout prints "Remaining jobs: ..." in order, which
          # helps to identify hung tests.
          export PYTHONUNBUFFERED=1
          build/test/functional/test_runner.py -j $(($(getconf NPROCESSORS_ONLN) * 2)) --combinedlogslen=99999999 \
            --tmpdirprefix "$PWD" \
            --extended \
            `# See https://github.com/bitcoin/bitcoin/issues/33128.` \
            --exclude feature_reindex_init \
            --timeout-factor=8
