name: GCC-SNAPSHOT
on:
  pull_request:
    paths:
      - '.github/workflows/gcc.yml'
  workflow_dispatch:
    inputs:
      skip_functional_tests:
        description: 'Skip functional tests'
        required: true
        default: false
        type: boolean
  workflow_run:
    # Chained on the "GCC snapshot" workflow (which itself follows "Manager"),
    # so that the freshly published snapshot image is used.
    workflows: ["GCC snapshot"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  resolve:
    name: 'Resolve the snapshot image'
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    outputs:
      image: ${{ steps.pick.outputs.image }}

    steps:
      - name: Download image reference from the "GCC snapshot" run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: gcc-snapshot-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f gcc-snapshot-image.txt ]; then
            image="$(cat gcc-snapshot-image.txt)"
          else
            image="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< '${{ github.repository_owner }}')/gcc-snapshot:latest"
          fi

          # Skip the build, rather than fail at container start-up, when the
          # image has not been published yet (e.g. before the first run of the
          # "GCC snapshot" workflow on the main branch).
          repository="${image#ghcr.io/}"; repository="${repository%%:*}"
          tag="${image##*:}"
          token="$(curl --fail --silent --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r .token)"
          if curl --fail --silent --head \
              --header "Authorization: Bearer ${token}" \
              --header "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${repository}/manifests/${tag}" > /dev/null; then
            echo "Using ${image}"
          else
            echo "::warning::Image ${image} is not published yet; skipping the build."
            image=""
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  gcc:
    name: 'GCC-SNAPSHOT, depends, no GUI'
    needs: resolve
    if: needs.resolve.outputs.image != ''
    runs-on: ubuntu-latest
    container: ${{ needs.resolve.outputs.image }}

    steps:
      - name: Install dependencies
        # Before the checkout, so that actions/checkout finds git.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            git ca-certificates cmake make curl patch pkg-config python3 bison file

      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: GCC version
        run: |
          cat /opt/gcc-snapshot/SNAPSHOT
          gcc-snapshot -v 2>&1 | tee gcc_version.txt

      - name: Build depends
        run: |
          make -C depends -j $(nproc) CC=gcc-snapshot CXX=g++-snapshot NO_QT=1 LOG=1

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "GCC-SNAPSHOT, depends, no GUI")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Unix Makefiles")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          EOF

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          set(CTEST_UPDATE_TYPE git)
          # This command may be redundant once the following MR is merged:
          # https://gitlab.kitware.com/cmake/cmake/-/merge_requests/12038
          set(CTEST_UPDATE_COMMAND "${CMAKE_COMMAND} -E true")
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          set(configure_opts
            "--preset dev-mode"
            "--toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Check 'bitcoind' executable
        run: |
          ls -l build/bin/bitcoind
          file build/bin/bitcoind
          ldd build/bin/bitcoind
          build/bin/bitcoind -version

      - name: Fetch test data
        run: |
          DIR_UNIT_TEST_DATA="$(pwd)/qa-assets/unit_test_data"
          echo "DIR_UNIT_TEST_DATA=${DIR_UNIT_TEST_DATA}" >> "$GITHUB_ENV"
          mkdir -p "$DIR_UNIT_TEST_DATA"
          curl --location --fail --output "${DIR_UNIT_TEST_DATA}/script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(PARALLEL_LEVEL ${nproc})

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES "$ENV{GITHUB_WORKSPACE}/gcc_version.txt")
          ctest_submit()
