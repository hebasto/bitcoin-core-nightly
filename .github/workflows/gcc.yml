name: GCC-SNAPSHOT
on:
  pull_request:
    paths:
      - '.github/workflows/gcc.yml'
  workflow_dispatch:
  workflow_run:
    # Chained on the "GCC snapshot" workflow (which itself follows "Manager"),
    # so that the freshly published snapshot image is used.
    workflows: ["GCC snapshot"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  resolve:
    name: 'Resolve the snapshot image'
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    outputs:
      image: ${{ steps.pick.outputs.image }}

    steps:
      - name: Download image reference from the "GCC snapshot" run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: gcc-snapshot-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f gcc-snapshot-image.txt ]; then
            image="$(cat gcc-snapshot-image.txt)"
          else
            image="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< '${{ github.repository_owner }}')/gcc-snapshot:latest"
          fi

          # Skip the build, rather than fail at container start-up, when the
          # image has not been published yet (e.g. before the first run of the
          # "GCC snapshot" workflow on the main branch).
          repository="${image#ghcr.io/}"; repository="${repository%%:*}"
          tag="${image##*:}"
          token="$(curl --fail --silent --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r .token)"
          if curl --fail --silent --head \
              --header "Authorization: Bearer ${token}" \
              --header "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${repository}/manifests/${tag}" > /dev/null; then
            echo "Using ${image}"
          else
            echo "::warning::Image ${image} is not published yet; skipping the build."
            image=""
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  gcc:
    name: 'GCC-SNAPSHOT, ${{ matrix.arch }}, depends, no GUI'
    needs: resolve
    if: needs.resolve.outputs.image != ''
    runs-on: ${{ matrix.runner }}
    container: ${{ needs.resolve.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            host: x86_64-pc-linux-gnu
          - arch: arm64
            runner: ubuntu-26.04-arm
            host: aarch64-unknown-linux-gnu

    steps:
      - name: Install dependencies
        # Before the checkout, so that actions/checkout finds git.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            git ca-certificates cmake ninja-build make curl patch pkg-config python3 bison file

      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: GCC version
        run: |
          cat /opt/gcc-snapshot/SNAPSHOT
          gcc-snapshot -v 2>&1 | tee gcc_version.txt

      - name: Build depends
        # The image has no plain `gcc`/`g++`, so the compilers for native
        # packages (`build_CC`/`build_CXX`) must be set explicitly as well.
        run: |
          gmake -C depends -j $(nproc) CC=gcc-snapshot CXX=g++-snapshot build_CC=gcc-snapshot build_CXX=g++-snapshot NO_QT=1 LOG=1

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "GCC-SNAPSHOT, ${{ matrix.arch }}, depends, no GUI")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Ninja")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          EOF

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          # This workflow is reached via `workflow_run` from the "GCC snapshot"
          # workflow, so look at that run's own trigger: only a chain started
          # by "Manager" is a nightly run; a manual rebuild of the image is not.
          ctest_start(${{ case(github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event.workflow_run.event || github.event_name)) }})
          set(CTEST_UPDATE_TYPE git)
          # This command may be redundant once the following MR is merged:
          # https://gitlab.kitware.com/cmake/cmake/-/merge_requests/12038
          set(CTEST_UPDATE_COMMAND "${CMAKE_COMMAND} -E true")
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          set(configure_opts
            "--preset dev-mode"
            "--toolchain depends/${{ matrix.host }}/toolchain.cmake"
            "-DBUILD_GUI=OFF"
            # Known false positives with gcc-17-20261018 (identical on x86_64 and arm64):
            #  - boost/multi_index/detail/bucket_array.hpp:165: '__builtin_memset' specified bound
            #    18446744073709551608 exceeds maximum object size (from CTxMemPool's hashed indexes)
            #  - src/prevector.h:169: writing 65 bytes into a region of size 40
            #    (from CreateGenesisBlock() in src/kernel/chainparams.cpp)
            "-DAPPEND_CXXFLAGS=-Wno-error=stringop-overflow"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Check 'bitcoind' executable
        run: |
          ls -l build/bin/bitcoind
          file build/bin/bitcoind
          ldd build/bin/bitcoind
          build/bin/bitcoind -version

      - name: Fetch test data
        run: |
          DIR_UNIT_TEST_DATA="$(pwd)/qa-assets/unit_test_data"
          echo "DIR_UNIT_TEST_DATA=${DIR_UNIT_TEST_DATA}" >> "$GITHUB_ENV"
          mkdir -p "$DIR_UNIT_TEST_DATA"
          curl --location --fail --output "${DIR_UNIT_TEST_DATA}/script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES "$ENV{GITHUB_WORKSPACE}/gcc_version.txt")
          ctest_submit()
