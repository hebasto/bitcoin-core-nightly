name: Windows, LLVM, arm64
on:
  pull_request:
    paths:
      - '.github/workflows/windows-llvm-arm64.yml'
      - 'patches/windows-fopen-noinherit.patch'
      - 'patches/windows-notify-tests-nocleanup.patch'
      - 'patches/windows-arm64-zeromq.patch'
  workflow_dispatch:
    inputs:
      skip_functional_tests:
        description: 'Skip functional tests'
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64.tar.xz
  CI_LLVM_MINGW_HASH: e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701
  CI_HOST: aarch64-w64-mingw32

jobs:
  windows-aarch64-cross:
    name: 'Windows ARM64, cross-build only, LLVM: no GUI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Bitcoin Core repo
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: nightly

      # Fix the libzmq 4.3.5 build for aarch64-w64-mingw32; see the patch header.
      - name: Patch depends
        run: git apply --verbose nightly/patches/windows-arm64-zeromq.patch

      # Keep child processes from inheriting open files; see the patch header.
      - name: Patch Bitcoin Core
        run: git apply --verbose nightly/patches/windows-fopen-noinherit.patch

      - name: Install LLVM MinGW toolchain
        run: |
          curl --location --fail --retry 5 --retry-delay 30 --retry-all-errors --output llvm_mingw_toolchain.tar.gz ${{ env.CI_LLVM_MINGW_URL }}
          echo "${{ env.CI_LLVM_MINGW_HASH }}  llvm_mingw_toolchain.tar.gz" | sha256sum --check
          mkdir llvm_mingw_toolchain
          tar -xf llvm_mingw_toolchain.tar.gz -C llvm_mingw_toolchain --strip-components=1
          echo "${GITHUB_WORKSPACE}/llvm_mingw_toolchain/bin" >> "$GITHUB_PATH"

      - name: Build depends
        run: |
          gmake -C depends -j $(nproc) HOST=${{ env.CI_HOST }} CC=${{ env.CI_HOST }}-clang CXX=${{ env.CI_HOST }}-clang++ NO_QT=1 LOG=1

      - name: Generate buildsystem
        run: |
          cmake -B build \
            --toolchain depends/${{ env.CI_HOST }}/toolchain.cmake \
            -DREDUCE_EXPORTS=ON \
            -DBUILD_BENCH=ON \
            -DBUILD_FUZZ_BINARY=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DAPPEND_CXXFLAGS="-Wno-error=return-type -Wno-error=conditional-uninitialized \
              `# Boost.Test references BOOST_TEST_DISABLE_ALT_STACK only in its sigaction-based` \
              `# signal handling, which is not selected on MinGW targets, so Clang reports the` \
              `# macro defined in src/test/main.cpp as unused. Revert this once Boost.Test is` \
              `# removed from Bitcoin Core: https://github.com/bitcoin/bitcoin/pull/35713` \
              -Wno-error=unused-macros \
            "

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Upload built executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CI_HOST }}-executables-${{ github.run_id }}
          path: |
            build/bin/*.exe
            build/src/**/*.exe
            build/test/config.ini
            build/test/with_sanitizer_env.py

  windows-aarch64-native-test:
    name: 'Windows ARM64, test cross-built executables natively'
    runs-on: windows-11-vs2026-arm
    needs: windows-aarch64-cross
    defaults:
      run:
        shell: pwsh -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"

    steps:
      - name: Checkout Bitcoin Core repo
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: nightly

      # Skip the cleanup of the tests that run -*notify commands; see the patch header.
      - name: Patch functional tests
        run: git apply --verbose --unidiff-zero nightly/patches/windows-notify-tests-nocleanup.patch

      - name: Download built executables
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CI_HOST }}-executables-${{ github.run_id }}

      - name: Check 'bitcoind.exe' executable
        # https://learn.microsoft.com/en-us/cpp/build/building-on-the-command-line?view=msvc-180#developer_command_file_locations
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64 -no_logo
          pwsh.exe -Command "dumpbin.exe /imports bin\bitcoind.exe | Select-String -Pattern '\S+\.dll' -CaseSensitive:$false" || exit 1
          bin\bitcoind.exe -version || exit 1

      - name: Run unit tests
        run: |
          bin\test_bitcoin.exe -l test_suite
          src\secp256k1\bin\exhaustive_tests.exe
          src\secp256k1\bin\noverify_tests.exe
          src\secp256k1\bin\tests.exe
          src\univalue\object.exe
          src\univalue\unitester.exe

      - name: Adjust paths in test\config.ini
        run: |
          (Get-Content "test\config.ini") -replace '(?<=^SRCDIR=).*', '${{ github.workspace }}' -replace '(?<=^BUILDDIR=).*', '${{ github.workspace }}' -replace '(?<=^RPCAUTH=).*', '${{ github.workspace }}\share\rpcauth\rpcauth.py' | Set-Content "test\config.ini"
          Get-Content "test\config.ini"

      - name: Run functional tests
        if: ${{ ! inputs.skip_functional_tests }}
        shell: bash
        env:
          PYTHONUTF8: 1
        run: |
          py -3 -m pip install pyzmq
          py -3 test/functional/test_runner.py -j $(($NUMBER_OF_PROCESSORS * 2)) --combinedlogslen=99999999 \
            --tmpdirprefix "$RUNNER_TEMP" \
            --extended \
            `# See https://github.com/hebasto/bitcoin-core-nightly/issues/213.` \
            --exclude wallet_multiwallet \
            --timeout-factor=40
