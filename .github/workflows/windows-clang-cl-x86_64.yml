name: Windows, clang-cl, x86_64
on:
  pull_request:
    paths:
      - '.github/workflows/windows-clang-cl-x86_64.yml'
      - 'patches/windows-alertnotify-debug-log-lock.patch'
  workflow_dispatch:
    inputs:
      skip_functional_tests:
        description: 'Skip functional tests'
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: 'Windows x86_64, clang-cl, no GUI, no IPC'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"

    steps:
      - name: Install dependencies
        run: |
          Add-Content -Path "$env:VCPKG_INSTALLATION_ROOT\triplets\x64-windows.cmake" -Value "set(VCPKG_BUILD_TYPE release)"
          vcpkg install boost-multi-index boost-test sqlite3[core] zeromq

      - name: Checkout Bitcoin Core repo
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin
          ref: refs/pull/31507/merge
          fetch-depth: 2

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: nightly

      # Reproducer for the intermittent cleanup failure seen in the nightly
      # run of 2026-10-26: the -alertnotify child outlives bitcoind and holds
      # the inherited debug.log handle, so shutil.rmtree() fails with
      # WinError 32. The test is expected to FAIL while this patch is applied.
      - name: Patch the functional test
        run: git apply --verbose nightly/patches/windows-alertnotify-debug-log-lock.patch

      - name: Get master branch commit hash
        id: master_commit
        run: |
          $commit = git rev-parse HEAD~1
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Generate CTest configuration
        run: |
          $config = @'
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "Windows x86_64, clang-cl, no GUI, no IPC")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Visual Studio 18 2026")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          '@
          Set-Content -Path "ctest_config.cmake" -Value $config -Encoding utf8

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          find_program(CTEST_GIT_COMMAND git REQUIRED)
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.master_commit.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --build-config Release --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          # Boost.Test references BOOST_TEST_DISABLE_ALT_STACK only in its sigaction-based
          # signal handling, which is not selected on Windows targets, so Clang reports the
          # macro defined in src/test/main.cpp and src/test/kernel/test_kernel.cpp as unused.
          # Revert -Wno-error=unused-macros once Boost.Test is removed from Bitcoin Core:
          # https://github.com/bitcoin/bitcoin/pull/35713
          set(ENV{CXXFLAGS} "-Wno-error=return-type -Wno-error=conditional-uninitialized -Wno-error=unused-macros")
          set(configure_opts
            "-T ClangCL"
            "--preset dev-mode"
            "-DBUILD_GUI=OFF"
            "-DWITH_USDT=OFF"
            "--toolchain $ENV{VCPKG_INSTALLATION_ROOT}\\scripts\\buildsystems\\vcpkg.cmake"
            "-DVCPKG_MANIFEST_MODE=OFF"
            "-DVCPKG_TARGET_TRIPLET=x64-windows"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --build-config Release --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Fetch test data
        run: |
          $dir = "$env:GITHUB_WORKSPACE\qa-assets\unit_test_data"
          "DIR_UNIT_TEST_DATA=$dir" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe --location --fail --output "$dir\script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --build-config Release --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_submit()

      - name: Run functional tests
        if: ${{ ! inputs.skip_functional_tests }}
        working-directory: build
        env:
          PYTHONUTF8: 1
          BITCOIN_BIN: '${{ github.workspace }}\build\bin\Release\bitcoin.exe'
          BITCOIND: '${{ github.workspace }}\build\bin\Release\bitcoind.exe'
          BITCOINCLI: '${{ github.workspace }}\build\bin\Release\bitcoin-cli.exe'
          BITCOIN_BENCH: '${{ github.workspace }}\build\bin\Release\bench_bitcoin.exe'
          BITCOINTX: '${{ github.workspace }}\build\bin\Release\bitcoin-tx.exe'
          BITCOINUTIL: '${{ github.workspace }}\build\bin\Release\bitcoin-util.exe'
          BITCOINWALLET: '${{ github.workspace }}\build\bin\Release\bitcoin-wallet.exe'
          BITCOINCHAINSTATE: '${{ github.workspace }}\build\bin\Release\bitcoin-chainstate.exe'
        shell: bash
        run: |
          py -3 -m pip install pyzmq
          py -3 test/functional/test_runner.py -j $(($NUMBER_OF_PROCESSORS * 2)) --combinedlogslen=4000 \
            --tmpdirprefix "$RUNNER_TEMP" \
            feature_versionbits_warning.py \
            --timeout-factor=40
