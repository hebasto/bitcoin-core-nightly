name: Windows, clang-cl, x86_64
on:
  pull_request:
    paths:
      - '.github/workflows/windows-clang-cl-x86_64.yml'
      - 'patches/windows-fopen-noinherit.patch'
  workflow_dispatch:
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: 'Windows x86_64, clang-cl, no IPC, Debug'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"

    env:
      VCPKG_PACKAGES: boost-multi-index boost-test sqlite3[core] zeromq qtbase[core,gui,network,png,testlib,widgets] qttools libqrencode

    steps:
      # vcpkg stores every package it builds in its binary cache and reuses an
      # archive only when the package ABI (triplet, compiler, port, features)
      # matches, so the cache key does not have to track those. It changes with
      # the runner image and with the package list, so a new image starts a
      # cache of its own instead of growing the old one with every rebuild.
      - name: Generate vcpkg cache key
        id: vcpkg-cache-key
        run: |
          Set-Content -Path vcpkg-packages.txt -Value $env:VCPKG_PACKAGES
          "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: clang-cl-x86_64-debug-vcpkg-${{ steps.vcpkg-cache-key.outputs.image-version }}-${{ hashFiles('vcpkg-packages.txt') }}
          restore-keys: clang-cl-x86_64-debug-vcpkg-${{ steps.vcpkg-cache-key.outputs.image-version }}-

      - name: Install dependencies
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }}

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: nightly

      # Files opened via fsbridge::fopen() are inherited by the -*notify child
      # processes, which can keep debug.log open after bitcoind has exited and
      # make the functional test framework's cleanup fail with WinError 32.
      # Temporary until https://github.com/bitcoin/bitcoin/issues/36668 is
      # resolved upstream.
      - name: Patch Bitcoin Core
        run: git apply --verbose nightly/patches/windows-fopen-noinherit.patch

      - name: Generate CTest configuration
        run: |
          $config = @'
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "Windows x86_64, clang-cl, no IPC, Debug")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Visual Studio 18 2026")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          '@
          Set-Content -Path "ctest_config.cmake" -Value $config -Encoding utf8

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          # CTest infers the VCS type from the update command's name. With
          # CTEST_UPDATE_VERSION_OVERRIDE set no update runs, but CTest still
          # invokes the command to list local modifications and reports any as
          # an update error. The command deliberately does not exist, so that
          # check is skipped on every runner, whether or not git is installed
          # and whether or not the tree has been patched.
          set(CTEST_UPDATE_COMMAND not-run/git)
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --build-config Debug --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          # Boost.Test references BOOST_TEST_DISABLE_ALT_STACK only in its sigaction-based
          # signal handling, which is not selected on Windows targets, so Clang reports the
          # macro defined in src/test/main.cpp and src/test/kernel/test_kernel.cpp as unused.
          # Revert -Wno-error=unused-macros once Boost.Test is removed from Bitcoin Core:
          # https://github.com/bitcoin/bitcoin/pull/35713
          set(ENV{CXXFLAGS} "-Wno-error=return-type -Wno-error=conditional-uninitialized -Wno-error=unused-macros")
          set(configure_opts
            "-T ClangCL"
            "--preset dev-mode"
            "-DWITH_USDT=OFF"
            "--toolchain $ENV{VCPKG_INSTALLATION_ROOT}\\scripts\\buildsystems\\vcpkg.cmake"
            "-DVCPKG_MANIFEST_MODE=OFF"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --build-config Debug --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Fetch test data
        run: |
          $dir = "$env:GITHUB_WORKSPACE\qa-assets\unit_test_data"
          "DIR_UNIT_TEST_DATA=$dir" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe --location --fail --retry 5 --retry-delay 30 --retry-all-errors --output "$dir\script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --build-config Debug --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_submit()
