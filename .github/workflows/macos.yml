name: macOS, arm64
on:
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      skip_functional_tests:
        description: 'Skip functional tests'
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: ["Manager"]
    types: [requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: 'macOS ARM64, Xcode 27'
    runs-on: xcode-27

    steps:
      - name: Checkout Bitcoin Core repo
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Install dependencies
        run: |
          # `aws/tap` is untrusted, which causes the following warning
          # during `brew update`:
          # ```
          # Warning: The following taps are not trusted:
          # aws/tap
          #
          # Homebrew is currently ignoring formulae, casks and commands from these taps because tap trust is required.
          #
          # Untap them with:
          # brew untap aws/tap
          # ```
          brew untap aws/tap || true
          brew update
          brew install git pkgconf boost zeromq qt qrencode capnp

      - name: Install CMake nightly build
        run: |
          base="https://cmake.org/files/dev"
          # The directory keeps about a year of builds and has no "latest"
          # alias. In `cmake-<major>.<minor>.<YYYYMMDD>-g<hash>-...` the third
          # dot-separated field starts with the build date.
          tarball="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 30 --retry-all-errors "${base}/" \
            | grep -o 'href="cmake-[^"]*-macos-universal\.tar\.gz"' | cut -d '"' -f 2 | sort -t . -k 3 | tail -1)"
          [ -n "${tarball}" ]
          curl --fail --silent --show-error --location --retry 5 --retry-delay 30 --retry-all-errors --output "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          # Takes precedence over any CMake that Homebrew or the runner provides.
          echo "${RUNNER_TEMP}/${tarball%.tar.gz}/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: CMake version
        run: |
          command -v cmake ctest
          cmake --version | tee cmake_version.txt

      - name: Generate CTest configuration
        run: |
          cat << 'EOF' > ctest_config.cmake
          set(CTEST_SITE "${{ github.repository }}")
          set(CTEST_BUILD_NAME "macOS ARM64, Xcode 27")
          set(CTEST_SOURCE_DIRECTORY "$ENV{GITHUB_WORKSPACE}")
          set(CTEST_BINARY_DIRECTORY "${CTEST_SOURCE_DIRECTORY}/build")
          set(CTEST_CMAKE_GENERATOR "Unix Makefiles")
          cmake_host_system_information(RESULT nproc QUERY NUMBER_OF_LOGICAL_CORES)
          EOF

      - name: CDash -- Start & Update
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(${{ case(github.event_name == 'workflow_run', 'Nightly', format('Experimental GROUP {0}', github.event_name)) }})
          # CTest infers the VCS type from the update command's name. With
          # CTEST_UPDATE_VERSION_OVERRIDE set no update runs, but CTest still
          # invokes the command to list local modifications and reports any as
          # an update error. The command deliberately does not exist, so that
          # check is skipped on every runner, whether or not git is installed
          # and whether or not the tree has been patched.
          set(CTEST_UPDATE_COMMAND not-run/git)
          set(CTEST_UPDATE_VERSION_OVERRIDE "${{ steps.checkout.outputs.commit }}")
          ctest_update()

      - name: CDash -- Configure
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          set(configure_opts
            "--preset dev-mode"
            "-DWITH_USDT=OFF"
            "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
            # Temporary: CMake 4.5 reports directory-scoped directives
            # (include_directories(), add_compile_options(), etc.) under the
            # new "non-target-directive" dev warning category, which the
            # dev-mode preset makes fatal. Bitcoin Core and its secp256k1
            # subtree still use them. Keep the warning visible, but non-fatal.
            # Remove once fixed upstream; see
            # https://github.com/bitcoin-core/secp256k1/pull/1996.
            "-Wno-error=non-target-directive"
          )
          ctest_start(APPEND)
          ctest_configure(OPTIONS "${configure_opts}")

      - name: CDash -- Build
        shell: ctest --extra-verbose --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_build(PARALLEL_LEVEL ${nproc})

      - name: Check 'bitcoind' executable
        run: |
          ls -l build/bin/bitcoind
          file build/bin/bitcoind
          otool -L build/bin/bitcoind
          build/bin/bitcoind -version

      - name: Fetch test data
        run: |
          DIR_UNIT_TEST_DATA="$(pwd)/qa-assets/unit_test_data"
          echo "DIR_UNIT_TEST_DATA=${DIR_UNIT_TEST_DATA}" >> "$GITHUB_ENV"
          mkdir -p "$DIR_UNIT_TEST_DATA"
          curl --location --fail --retry 5 --retry-delay 30 --retry-all-errors --output "${DIR_UNIT_TEST_DATA}/script_assets_test.json" https://github.com/bitcoin-core/qa-assets/raw/main/unit_test_data/script_assets_test.json

      - name: CDash -- Test
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          ctest_test(
            PARALLEL_LEVEL ${nproc}
            RETURN_VALUE test_result
          )
          # ctest_test() does not fail the script when tests fail.
          # The only signal is RETURN_VALUE (0 == all tests passed).
          if(NOT test_result EQUAL 0)
            message(FATAL_ERROR "Tests failed: RETURN_VALUE=${test_result}")
          endif()

      - name: CDash -- Submit
        if: always()
        shell: ctest --script {0}
        run: |
          include("$ENV{GITHUB_WORKSPACE}/ctest_config.cmake")
          ctest_start(APPEND)
          set(CTEST_NOTES_FILES "$ENV{GITHUB_WORKSPACE}/cmake_version.txt")
          ctest_submit()

      - name: Run functional tests
        if: ${{ ! inputs.skip_functional_tests }}
        run: |
          build/test/functional/test_runner.py -j 8 --combinedlogslen=99999999 \
            --extended
